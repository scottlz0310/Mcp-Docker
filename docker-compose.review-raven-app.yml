services:
  mcp-gateway:
    environment:
      - ROUTE_REVIEW_RAVEN=/mcp/review-raven|http://review-raven:${REVIEW_RAVEN_PORT:-8083}/mcp

  review-raven:
    environment:
      - REVIEW_RAVEN_AUTH_MODE=github-app
      - REVIEW_RAVEN_GITHUB_APP_ID=${REVIEW_RAVEN_GITHUB_APP_ID:?専用AppのIDを指定してください}
      - REVIEW_RAVEN_GITHUB_APP_INSTALLATION_ID=${REVIEW_RAVEN_GITHUB_APP_INSTALLATION_ID:?専用AppのInstallation IDを指定してください}
      - REVIEW_RAVEN_GITHUB_APP_OWNER=${REVIEW_RAVEN_GITHUB_APP_OWNER:?対象組織を指定してください}
      - REVIEW_RAVEN_GITHUB_APP_PRIVATE_KEY_B64=${REVIEW_RAVEN_GITHUB_APP_PRIVATE_KEY_B64:?専用Appの秘密鍵を保管庫から注入してください}
