services:
  github-mcp:
    image: ${GITHUB_MCP_IMAGE:-ghcr.io/github/github-mcp-server:main}
    container_name: mcp-github
    restart: unless-stopped
    command: ["http", "--port", "${GITHUB_MCP_HTTP_PORT:-8082}"]

    environment:
      - GITHUB_API_URL=${GITHUB_API_URL:-https://api.github.com}
      - LOG_LEVEL=${LOG_LEVEL:-info}

    volumes:
      - ./config/github-mcp:/app/config
      - github-mcp-cache:/app/cache

    # Exposed only within the Docker network. Direct host access is intentionally
    # removed; use mcp-gateway (:8080) for authenticated external access.
    expose:
      - "${GITHUB_MCP_HTTP_PORT:-8082}"

    networks:
      - mcp-network

    # Note: GitHub MCP Server uses a distroless image without shell commands.
    # Health is validated from host side via scripts/health-check.sh.
    healthcheck:
      disable: true

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  mcp-gateway:
    image: ${GITHUB_MCP_GATEWAY_IMAGE:-ghcr.io/scottlz0310/mcp-gateway:latest}
    container_name: mcp-gateway
    restart: unless-stopped
    depends_on:
      github-mcp:
        condition: service_started
      review-raven:
        condition: service_started
      # playwright-mcp は任意（既定では起動しない。有効化の手順は playwright-mcp サービスの
      # コメントを参照）。required: false により、起動していなくても gateway は起動できる。
      playwright-mcp:
        condition: service_started
        required: false
      thread-owl:
        condition: service_started

    environment:
      # GitHub App の Client ID / Secret を指定します（Client ID は Iv23... 形式）。
      # GitHub App には <MCP_GATEWAY_PUBLIC_URL>/callback と
      # <MCP_GATEWAY_PUBLIC_URL>/device_callback の両方を登録してください。
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      # mcp-gateway v0.6.0+: builtin にすることで gateway 自身が OIDC AS として動作し
      # GitHub OAuth App は social login（identity 取得）のみに使用する（mcp-gateway#126）。
      # 従来の github モードに戻す場合は .env に OAUTH_PROVIDER=github を設定してください。
      - OAUTH_PROVIDER=${OAUTH_PROVIDER:-builtin}
      - MCP_GATEWAY_PUBLIC_URL=${MCP_GATEWAY_PUBLIC_URL:-${MCP_GATEWAY_BASE_URL:-http://127.0.0.1:${MCP_GATEWAY_PORT:-8080}}}
      - MCP_GATEWAY_BIND_ADDR=${MCP_GATEWAY_BIND_ADDR:-0.0.0.0:${MCP_GATEWAY_PORT:-8080}}
      - MCP_GATEWAY_PORT=${MCP_GATEWAY_PORT:-8080}
      - MCP_GATEWAY_KEY_PATH=${MCP_GATEWAY_KEY_PATH:-/data/gateway.key}
      - MCP_CONFIG_FILE=${MCP_CONFIG_FILE:-/data/config.yaml}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID}
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app/private-key.pem
      - GITHUB_API_URL=${GITHUB_API_URL:-https://api.github.com}
      - ROUTE_GITHUB=/mcp/github|http://github-mcp:${GITHUB_MCP_HTTP_PORT:-8082}|upstream_github_app=true
      - ROUTE_REVIEW_RAVEN=/mcp/review-raven|http://review-raven:${REVIEW_RAVEN_PORT:-8083}/mcp|upstream_provider_token=true
      # playwright は任意。PLAYWRIGHT_MCP_ENABLED が未設定の間は、ルートが空になり、
      # gateway は公開せず、mcp-docker register も登録対象にしない（#167 の ${VAR:+...} の仕組み）。
      - ROUTE_PLAYWRIGHT=${PLAYWRIGHT_MCP_ENABLED:+/mcp/playwright|http://playwright-mcp:${PLAYWRIGHT_MCP_PORT:-8931}|auth=none}
      - ROUTE_THREAD_OWL=/mcp/thread-owl|http://thread-owl:${THREAD_OWL_PORT:-3000}/mcp
      - OAUTH_SCOPES=${OAUTH_SCOPES:-repo,user}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SESSION_TTL_MIN=${SESSION_TTL_MIN:-10}
      - TOKEN_CACHE_TTL_MIN=${TOKEN_CACHE_TTL_MIN:-30}
      - TOKEN_EXPIRES_IN_SEC=${TOKEN_EXPIRES_IN_SEC:-7776000}
      - MCP_GATEWAY_TOKEN_STORE_PATH=${MCP_GATEWAY_TOKEN_STORE_PATH:-/data/tokens.db}
      - MCP_GATEWAY_AUTH_AUDIT_LOG_PATH=${MCP_GATEWAY_AUTH_AUDIT_LOG_PATH:-/data/logs/auth-audit.jsonl}
      - MCP_GATEWAY_GITHUB_REFRESH_ENABLED=${MCP_GATEWAY_GITHUB_REFRESH_ENABLED:-true}
      - GATEWAY_LEGACY_ADAPTER_ENABLED=${GATEWAY_LEGACY_ADAPTER_ENABLED:-false}
      - MCP_GATEWAY_INTERNAL_SECRET=${MCP_GATEWAY_INTERNAL_SECRET}
      - MCP_GATEWAY_INTERNAL_PORT=${MCP_GATEWAY_INTERNAL_PORT:-9090}
      # ローカル HTTPS (TLS) 終端。make setup-tls が .env に設定する。
      # 両方とも空の場合、gateway は従来どおり HTTP で listen する。
      - MCP_GATEWAY_TLS_CERT_PATH=${MCP_GATEWAY_TLS_CERT_PATH:-}
      - MCP_GATEWAY_TLS_KEY_PATH=${MCP_GATEWAY_TLS_KEY_PATH:-}

    volumes:
      - mcp-gateway-data:/data
      # TLS 証明書（make setup-tls で生成）。Go プロセスのデッドロックを避けるため
      # ファイル単体ではなく親ディレクトリ単位でマウントする。
      - ./config/certs:/data/certs:ro
      - ./config/github-app:/run/secrets/github-app:ro

    ports:
      - "127.0.0.1:${MCP_GATEWAY_PORT:-8080}:${MCP_GATEWAY_PORT:-8080}"

    networks:
      - mcp-network

    healthcheck:
      disable: true

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  review-raven:
    image: ${REVIEW_RAVEN_IMAGE:-ghcr.io/scottlz0310/review-raven:latest}
    container_name: review-raven
    restart: unless-stopped
    # distroless:nonroot の UID/GID を明示（UID=65532）。
    # /data ボリュームの初回マウント時、Docker はイメージの /data ディレクトリ
    # （Dockerfile で COPY --chown=nonroot:nonroot 済み）の内容をボリュームに
    # コピーするため、正しいオーナーシップが引き継がれます。
    # 既存の空ボリュームが root 所有になっている場合は
    # "docker volume rm review-raven-data" で削除後に再作成してください。
    user: "65532:65532"

    environment:
      - BIND_ADDR=0.0.0.0
      - MCP_PORT=${REVIEW_RAVEN_PORT:-8083}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # コメントの本文を、エージェントの文脈に入れてよい投稿者の許可リスト（カンマ区切りの GitHub の login。
      # name でも name[bot] でもよい）。review-raven の get_trusted_comment_authors が公開し、reviewed skill が取得する。
      # PR の作成者の許可リスト（thread-owl の ALLOWED_AUTHORS）とは別の問い。未設定の間は、tool がエラーを返し、
      # reviewed skill は fail-closed に停止する。
      - TRUSTED_COMMENT_AUTHORS=${REVIEW_RAVEN_TRUSTED_COMMENT_AUTHORS:-}

    # mcp-gateway 経由でのみアクセス（http://127.0.0.1:8080/mcp/review-raven）。
    # ホストから直接アクセスする場合は下記のコメントを解除してください。
    # ports:
    #   - "127.0.0.1:${REVIEW_RAVEN_PORT:-8083}:${REVIEW_RAVEN_PORT:-8083}"
    expose:
      - "${REVIEW_RAVEN_PORT:-8083}"

    volumes:
      - review-raven-data:/data

    networks:
      - mcp-network

    # Note: distroless image has no shell/wget. Health is validated host-side.
    healthcheck:
      disable: true

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  gateway-credentials-check:
    image: ${CURL_IMAGE:-curlimages/curl:8.22.0}
    profiles: ["diagnostics"]
    network_mode: "service:mcp-gateway"
    depends_on:
      mcp-gateway:
        condition: service_started
    environment:
      - MCP_GATEWAY_INTERNAL_SECRET=${MCP_GATEWAY_INTERNAL_SECRET}
      - MCP_GATEWAY_INTERNAL_PORT=${MCP_GATEWAY_INTERNAL_PORT:-9090}
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        response="$$(curl -fsS \
          -H "Authorization: Bearer $${MCP_GATEWAY_INTERNAL_SECRET}" \
          "http://127.0.0.1:$${MCP_GATEWAY_INTERNAL_PORT}/internal/v1/credentials")"
        case "$${response}" in
          *'"credential_type":"github_app_installation"'*'"ready":true'*)
            echo "GitHub App installation credential is ready"
            ;;
          *)
            echo "GitHub App installation credential is not ready" >&2
            exit 1
            ;;
        esac

  thread-owl:
    image: ${THREAD_OWL_IMAGE:-ghcr.io/scottlz0310/thread-owl:latest}
    container_name: thread-owl
    restart: unless-stopped
    command: ["--mcp-http"]

    environment:
      - GITHUB_APP_ID=${THREAD_OWL_GITHUB_APP_ID}
      # 秘密鍵は B64 形式を推奨（ファイルマウント不要）。
      # FILE 形式を使う場合は GITHUB_APP_PRIVATE_KEY_FILE=/data/github-app.pem を指定し
      # volumes に ${THREAD_OWL_PEM_PATH}:/data/github-app.pem:ro を追加してください。
      - GITHUB_APP_PRIVATE_KEY_B64=${THREAD_OWL_GITHUB_APP_PRIVATE_KEY_B64}
      - ALLOWED_REPOS=${THREAD_OWL_ALLOWED_REPOS}
      # PR の作成者として信頼する GitHub の login（カンマ区切り。bot は name でも name[bot] でもよい）。
      # 自分の login と、再レビューを依頼する bot 名義（scottlz0310-mcp-gateway、review-raven など）を指定する。
      # 設定すると、許可された作成者の同一リポジトリの PR だけを queue に載せる（fork は常に拒否）。
      # 未設定（空）の間は、作成者を検証できないため、すべての PR と再レビュー依頼を拒否する（fail-closed。thread-owl v0.7.0 以降）。
      - ALLOWED_AUTHORS=${THREAD_OWL_ALLOWED_AUTHORS:-}
      - HOST=0.0.0.0
      - PORT=${THREAD_OWL_PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}

    expose:
      - "${THREAD_OWL_PORT:-3000}"

    networks:
      - mcp-network

    healthcheck:
      disable: true

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # =============================================================================
  # auth=none ルートの例: 認証不要な MCP サーバを追加するパターン（任意。既定では起動しない）
  # =============================================================================
  # 上記 playwright-mcp サービスが auth=none ルートパターンの実装例です。
  #
  # playwright-mcp を有効にする手順（MCP サーバーは、登録数が増えるほど攻撃面が広がるため、既定では無効）:
  #   1. .env に PLAYWRIGHT_MCP_ENABLED=1 を設定（mcp-gateway が /mcp/playwright を公開し、
  #      mcp-docker register が登録対象にする）
  #   2. make start-gateway（PLAYWRIGHT_MCP_ENABLED が設定されていれば playwright-mcp も起動する）。
  #      make を使わずに docker compose を直接使う場合は、.env に COMPOSE_PROFILES=playwright も設定する
  #   3. make register-all などで登録（config/mcp-profiles.yml に playwright を加えた agent にだけ載せる）
  #
  # 新たな認証不要 MCP サーバを追加する場合は同様の手順で追加してください:
  #   1. サービス定義を追加（image, command に --port/--host, expose, networks を指定）
  #   2. mcp-gateway の ROUTE_<NAME>=/<path>|http://<service>:<port>|auth=none を追加
  #   3. mcp-gateway の depends_on に新サービスを追加（任意のサービスなら required: false）
  #   4. IDE 設定に "url": "http://127.0.0.1:8080/<path>" を追加
  #   5. make restart
  #
  playwright-mcp:
    profiles: ["playwright"]
    image: ${PLAYWRIGHT_MCP_IMAGE:-mcr.microsoft.com/playwright/mcp:latest}
    container_name: playwright-mcp
    restart: unless-stopped
    command: ["--port", "${PLAYWRIGHT_MCP_PORT:-8931}", "--host", "0.0.0.0", "--allowed-hosts", "*"]
    expose:
      - "${PLAYWRIGHT_MCP_PORT:-8931}"
    networks:
      - mcp-network
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  github-mcp-cache:
    driver: local
  review-raven-data:
    driver: local
  mcp-gateway-data:
    driver: local
  thread-owl-data:
    driver: local

networks:
  mcp-network:
    driver: bridge
