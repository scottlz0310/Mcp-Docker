name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-shell:
    name: シェルスクリプトLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: shellcheckインストール
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      
      - name: シェルスクリプトLint実行
        run: bash scripts/lint-shell.sh

  test-shell:
    name: シェルスクリプトテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Batsインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      
      - name: シェルスクリプトテスト実行
        run: bats tests/shell/*.bats

  test-powershell:
    name: PowerShell Lint・テスト（PSScriptAnalyzer/Pester）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = @('scripts', 'tests/powershell') | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings PSScriptAnalyzerSettings.psd1
          }
          $results | Format-Table RuleName, Severity, ScriptName, Line -AutoSize
          if ($results) { exit 1 }

      - name: Pester テスト
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-Pester -Path tests/powershell -Output Detailed -CI

  test-go:
    name: Go CLI チェック（vet/test/build）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Go セットアップ
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # 外部のスクリプトを、検証せずに実行しない（curl | bash は、壊れた応答や、意図しない内容もそのまま実行する）。
      # 取得（再試行つき）、検証（シェルスクリプトであること）、実行の順に行う。
      # 外部の一時的な失敗で CI を落とさない: agy を使うテストは、PATH に無ければ t.Skip する。
      # ただし、仕様乖離の検出が黙って無くならないよう、失敗は警告（annotation）で見えるようにする（#344）。
      - name: Antigravity CLI セットアップ（バイナリ仕様検証用）
        run: |
          set -uo pipefail
          script="$RUNNER_TEMP/antigravity-install.sh"

          warn() {
            echo "::warning title=Antigravity CLI::$1。agy に依存するテスト（バイナリ仕様検証）はこの回 skip されます"
          }

          if ! curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$script" https://antigravity.google/cli/install.sh; then
            warn "install.sh を取得できませんでした"
            exit 0
          fi
          if [ "$(head -c 2 "$script")" != '#!' ]; then
            warn "取得した install.sh がシェルスクリプトではありません（先頭が #! ではない）"
            exit 0
          fi
          if ! bash "$script"; then
            warn "install.sh の実行に失敗しました"
            exit 0
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if ! PATH="$HOME/.local/bin:$PATH" command -v agy >/dev/null; then
            warn "install.sh は成功しましたが、agy が $HOME/.local/bin にありません"
          fi

      - name: Go テスト
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: カバレッジファイル確認
        run: test -s coverage.out

      - name: Codecov アップロード
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          flags: go-cli
          name: go-cli
          use_oidc: true
          fail_ci_if_error: true
          verbose: true

      - name: Go ビルド
        run: go build ./cmd/mcp-docker

  check-skill-revision:
    name: skill revision チェック
    # base ref との比較が必要なため pull_request でのみ実行する。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: skill 変更時の revision 更新を確認
        run: bash scripts/check-skill-revision.sh "origin/${{ github.base_ref }}"
