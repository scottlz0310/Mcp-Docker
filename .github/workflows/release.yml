name: リリース

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ（例: v2.21.2）"
        required: true
        type: string
      source_ref:
        description: "リリース対象の branch / tag / commit（既定: main）"
        required: false
        default: main
        type: string

concurrency:
  group: mcp-docker-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-context:
    name: リリースコンテキスト検証
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: タグ・対象コミット検証
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $TAG" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] && git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Git tag already exists: $TAG" >&2
            exit 1
          fi

          SOURCE_SHA="$(git rev-parse HEAD)"
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG"
          echo "source ref: $SOURCE_SHA"

  test:
    name: テスト・lint
    needs: release-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.source_sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    name: ビルド (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [release-context, test]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.source_sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: バイナリビルド＆アーカイブ
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          BIN="mcp-docker${{ matrix.ext }}"
          VERSION="${{ needs.release-context.outputs.version }}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${BIN}" ./cmd/mcp-docker
          if [[ "${{ matrix.goos }}" == "linux" && "${{ matrix.goarch }}" == "amd64" ]]; then
            test "$(./${BIN} --version)" = "mcp-docker ${VERSION}"
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "mcp-docker-${{ matrix.suffix }}.zip" "${BIN}"
          else
            tar czf "mcp-docker-${{ matrix.suffix }}.tar.gz" "${BIN}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.suffix }}
          path: mcp-docker-${{ matrix.suffix }}.*

  release:
    name: リリース作成
    needs: [release-context, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: チェックサムファイル生成
        run: |
          cd dist
          sha256sum mcp-docker-*.tar.gz mcp-docker-*.zip 2>/dev/null | sort > checksums.txt

      - name: GitHub Release 作成
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          SOURCE_SHA: ${{ needs.release-context.outputs.source_sha }}
        run: |
          set -euo pipefail
          ARCHIVES=$(find dist \( -name "mcp-docker-*.tar.gz" -o -name "mcp-docker-*.zip" \) | sort | tr '\n' ' ')
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            ${ARCHIVES} \
            dist/checksums.txt
          echo "released $RELEASE_TAG from $SOURCE_SHA"
