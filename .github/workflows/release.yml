name: リリース

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mcp-docker-stable-release
  cancel-in-progress: false

jobs:
  draft:
    if: startsWith(github.event.head_commit.message, 'chore(release):')
    uses: scottlz0310/release-automate/.github/workflows/reusable-publish-release.yml@7f53bc1716dc7da1740be166e55b5d94b33041e6 # v3.2.0
    permissions:
      contents: write
    with:
      draft: true

  release-context:
    needs: draft
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: 安定版の形式を確認
        id: metadata
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::版は vMAJOR.MINOR.PATCH（RC・build metadata 可）で指定してください'
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  test:
    name: テスト・lint
    needs: [draft, release-context]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    name: ビルド (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [draft, release-context, test]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: バイナリビルド＆アーカイブ
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.release-context.outputs.version }}
          EXT: ${{ matrix.ext }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          bin="mcp-docker$EXT"
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$bin" ./cmd/mcp-docker
          if [[ "$GOOS/$GOARCH" == linux/amd64 ]]; then
            test "$(./mcp-docker --version)" = "mcp-docker $VERSION"
          fi
          if [[ "$GOOS" == windows ]]; then
            zip "mcp-docker-$SUFFIX.zip" "$bin"
          else
            tar czf "mcp-docker-$SUFFIX.tar.gz" "$bin"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.suffix }}
          path: mcp-docker-${{ matrix.suffix }}.*
          if-no-files-found: error

  attach:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      checksum_digest: ${{ steps.attach.outputs.checksum_digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist/
          merge-multiple: true
      - name: 対象 draft に成果物を添付
        id: attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag_name }}
          TARGET_SHA: ${{ needs.draft.outputs.target_sha }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish |
            jq -e --arg sha "$TARGET_SHA" '.isDraft == true and .targetCommitish == $sha'
          (cd dist && sha256sum mcp-docker-*.tar.gz mcp-docker-*.zip | sort > checksums.txt)
          echo "checksum_digest=$(sha256sum dist/checksums.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" dist/mcp-docker-*.tar.gz dist/mcp-docker-*.zip dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

  verify-assets:
    needs: [draft, release-context, attach]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}
      - name: draft の成果物を再取得して検証
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag_name }}
          TARGET_SHA: ${{ needs.draft.outputs.target_sha }}
          VERSION: ${{ needs.release-context.outputs.version }}
          EXPECTED_CHECKSUM_DIGEST: ${{ needs.attach.outputs.checksum_digest }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets > release.json
          jq -e --arg sha "$TARGET_SHA" '.isDraft == true and .targetCommitish == $sha and
            ([.assets[].name] | sort) == (["checksums.txt", "mcp-docker-darwin-amd64.tar.gz",
            "mcp-docker-darwin-arm64.tar.gz", "mcp-docker-linux-amd64.tar.gz",
            "mcp-docker-linux-arm64.tar.gz", "mcp-docker-windows-amd64.zip"] | sort)' release.json
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verified-assets
          actual=$(sha256sum verified-assets/checksums.txt | cut -d ' ' -f 1)
          test "$actual" = "$EXPECTED_CHECKSUM_DIGEST"
          bash scripts/verify-release-assets.sh verified-assets "$VERSION"

  finalize:
    needs: [draft, verify-assets]
    uses: scottlz0310/release-automate/.github/workflows/reusable-finalize-release.yml@7f53bc1716dc7da1740be166e55b5d94b33041e6 # v3.2.0
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.draft.outputs.tag_name }}
      target_sha: ${{ needs.draft.outputs.target_sha }}
      append_release_evidence: true
      verification_results: ${{ toJSON(needs) }}
